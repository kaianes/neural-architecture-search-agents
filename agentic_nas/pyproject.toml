[project]
name = "agentic_nas"
version = "0.1.0"
description = "agentic-nas using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.9.3",
    "datasets>=2.20.0",
    "pandas>=2.3.3",
    "Pillow>=10.0.0",
    "python-dotenv>=1.1.1",
    "torch>=2.0.0",
    "optuna>=3.0.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
agentic_nas = "agentic_nas.main:run"
run_crew = "agentic_nas.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
